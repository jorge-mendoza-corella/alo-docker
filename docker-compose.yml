version: '3.9'

services:
  alo-agentes:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GITHUB_USER: ${GITHUB_USER}
    container_name: alo-agentes
    environment:
      # Bitwarden
      BW_MASTER_PASSWORD: ${BW_MASTER_PASSWORD}
      BW_CLIENTID: ${BW_CLIENTID}
      BW_CLIENTSECRET: ${BW_CLIENTSECRET}
      # Supabase
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      # Entorno
      NODE_ENV: production
      # OpenClaw server base (para conectar con Alo)
      OPENCLAW_HOST: ${OPENCLAW_HOST:-localhost}
      OPENCLAW_PORT: ${OPENCLAW_PORT:-18789}
    ports:
      - "3000:3000"      # Dashboard (Next.js)
      - "8000:8000"      # Agentes API principal
      - "8001:8001"      # Agentes API secundario
    volumes:
      - alo-workspace:/home/alo/workspace
      - alo-secrets:/home/alo/.openclaw/secrets
      - alo-state:/home/alo/state
    restart: unless-stopped
    networks:
      - alo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  alo-workspace:
    driver: local
  alo-secrets:
    driver: local
  alo-state:
    driver: local

networks:
  alo-network:
    driver: bridge
